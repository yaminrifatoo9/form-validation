    <div class="box">
        <form action="#" class="needs-validation" novalidate>
            
        <div class="mb-3">
            <label for="name" class="for-level">Enter your name</label>
            <input type="text" class="form-control name" id="name" required>

            <div class="valid-feedback">
                Correct
            </div>
            <div class="invalid-feedback">
                Incorrect
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="for-level">Enter your email</label>
            <input type="email" class="form-control email" id="email" required>

            <div class="valid-feedback">
                Correct
            </div>
            <div class="invalid-feedback">
                Enter your email address
            </div>
        </div>


        <div class="mb-3">
            <button type="submit" class="btn btn-dark">submit</button>
        </div>
        </form>
